<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#061229" />
    <title>株モン - オフライン</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        color: #f8fbff;
        background:
          radial-gradient(circle at 50% 0%, rgba(34, 183, 255, 0.24), transparent 26rem),
          linear-gradient(180deg, #040816 0%, #061126 52%, #020712 100%);
        font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      }

      main {
        width: min(100%, 390px);
        padding: 22px;
        border: 1px solid rgba(62, 208, 255, 0.78);
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(13, 42, 88, 0.94), rgba(4, 15, 38, 0.94));
        box-shadow: inset 0 0 18px rgba(35, 172, 255, 0.14), 0 0 22px rgba(24, 137, 234, 0.28);
      }

      h1 {
        margin: 0 0 10px;
        color: #ffd46c;
        font-size: 34px;
        line-height: 1;
        text-shadow: 0 3px 0 #70430c, 0 0 18px rgba(255, 197, 70, 0.38);
      }

      p {
        margin: 0;
        color: #9fb2ce;
        font-size: 14px;
        line-height: 1.7;
      }

      a {
        display: inline-grid;
        place-items: center;
        min-height: 44px;
        margin-top: 18px;
        padding: 0 18px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 7px;
        color: #fffaf0;
        background: linear-gradient(180deg, #ffc75a, #a86409);
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>株モン</h1>
      <p>現在オフラインです。保存済みの画面を開けない場合は、通信が戻ってから再読み込みしてください。</p>
      <a href="/">再読み込み</a>
    </main>
  </body>
</html>
